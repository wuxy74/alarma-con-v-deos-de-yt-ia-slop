name: Compilar APK del despertador

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el proyecto (el zip con el número más alto)
        run: |
          ZIP=$(ls proyecto-v*.zip | sort -V | tail -n 1)
          echo "Usando $ZIP"
          unzip -o "$ZIP"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar
        run: gradle assembleDebug --no-daemon

      - name: Guardar la APK
        uses: actions/upload-artifact@v4
        with:
          name: despertador-youtube-apk
          path: app/build/outputs/apk/debug/*.apk
