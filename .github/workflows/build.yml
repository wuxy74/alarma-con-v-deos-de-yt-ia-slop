          cat > app/src/main/java/com/despertador/youtube/AlarmActivity.java <<'FIN_ARCHIVO_6'
          package com.despertador.youtube;

          import android.app.Activity;
          import android.app.NotificationManager;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.media.AudioAttributes;
          import android.media.AudioManager;
          import android.media.Ringtone;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.LinearLayout;

          public class AlarmActivity extends Activity {
              private static final String JS_PLAY =
                      "(function(){var v=document.querySelector('video');"
                      + "if(v){v.muted=false;v.volume=1;var p=v.play();if(p&&p.catch){p.catch(function(){});}}})();";
              private static final String JS_COMPROBAR =
                      "(function(){var v=document.querySelector('video');"
                      + "return !!(v&&!v.paused&&v.currentTime>0);})();";

              private WebView web;
              private Ringtone tono;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private int intentos = 0;

              private final Runnable reproducir = new Runnable() {
                  @Override
                  public void run() {
                      if (web == null) return;
                      web.evaluateJavascript(JS_PLAY, null);
                      intentos++;
                      if (intentos < 15) handler.postDelayed(this, 2000);
                  }
              };

              private final Runnable comprobar = new Runnable() {
                  @Override
                  public void run() {
                      if (web == null) return;
                      web.evaluateJavascript(JS_COMPROBAR, resultado -> {
                          if (!"true".equals(resultado)) sonarDeRespaldo();
                      });
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  setShowWhenLocked(true);
                  setTurnScreenOn(true);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  NotificationManager nm =
                          (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  nm.cancel(1);

                  // Volumen multimedia al máximo.
                  try {
                      AudioManager am = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                      am.setStreamVolume(AudioManager.STREAM_MUSIC,
                              am.getStreamMaxVolume(AudioManager.STREAM_MUSIC), 0);
                  } catch (Exception e) {
                      // Sin permiso para cambiar el volumen: se queda como esté.
                  }

                  LinearLayout raiz = new LinearLayout(this);
                  raiz.setOrientation(LinearLayout.VERTICAL);
                  raiz.setBackgroundColor(Color.BLACK);

                  try {
                      web = new WebView(this);
                      WebSettings s = web.getSettings();
                      s.setJavaScriptEnabled(true);
                      s.setDomStorageEnabled(true);
                      s.setMediaPlaybackRequiresUserGesture(false);
                      web.setWebChromeClient(new WebChromeClient());
                      web.setWebViewClient(new WebViewClient() {
                          @Override
                          public void onPageFinished(WebView view, String url) {
                              handler.removeCallbacks(reproducir);
                              intentos = 0;
                              handler.post(reproducir);
                          }

                          @Override
                          public void onReceivedError(WebView view, WebResourceRequest request,
                                                      WebResourceError error) {
                              if (request.isForMainFrame()) sonarDeRespaldo();
                          }
                      });
                      raiz.addView(web, new LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f));
                  } catch (Throwable t) {
                      web = null;
                      sonarDeRespaldo();
                  }

                  Button parar = new Button(this);
                  parar.setText("PARAR");
                  parar.setTextSize(22);
                  parar.setOnClickListener(v -> detener());
                  int alto = (int) (90 * getResources().getDisplayMetrics().density);
                  raiz.addView(parar, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, alto));

                  setContentView(raiz);

                  if (web != null) {
                      String url = Scheduler.normalizarUrl(Scheduler.prefs(this).getString("url", ""));
                      web.loadUrl(url);
                      // Si a los 30 s no suena el vídeo, entra el tono de respaldo.
                      handler.postDelayed(comprobar, 30000);
                  }
                  // Parada automática a los 30 minutos.
                  handler.postDelayed(this::detener, 30 * 60 * 1000L);
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
              }

              private void sonarDeRespaldo() {
                  if (tono != null) return;
                  try {
                      Uri uri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM);
                      tono = RingtoneManager.getRingtone(this, uri);
                      tono.setAudioAttributes(new AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_ALARM)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                              .build());
                      if (Build.VERSION.SDK_INT >= 28) tono.setLooping(true);
                      tono.play();
                  } catch (Throwable t) {
                      // Sin tono de respaldo.
                  }
              }

              private void limpiar() {
                  handler.removeCallbacksAndMessages(null);
                  if (tono != null) {
                      tono.stop();
                      tono = null;
                  }
                  if (web != null) {
                      web.loadUrl("about:blank");
                      web.destroy();
                      web = null;
                  }
              }

              private void detener() {
                  limpiar();
                  finish();
              }

              @Override
              protected void onDestroy() {
                  limpiar();
                  super.onDestroy();
              }
          }
          FIN_ARCHIVO_6
