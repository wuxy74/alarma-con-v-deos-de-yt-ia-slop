          cat > app/src/main/java/com/despertador/youtube/AlarmReceiver.java <<'FIN_ARCHIVO_7'
          package com.despertador.youtube;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;

          public class AlarmReceiver extends BroadcastReceiver {
              static final String CANAL = "alarma";

              @Override
              public void onReceive(Context c, Intent intent) {
                  String accion = intent.getAction();
                  if (Intent.ACTION_BOOT_COMPLETED.equals(accion)
                          || Intent.ACTION_LOCKED_BOOT_COMPLETED.equals(accion)
                          || Intent.ACTION_MY_PACKAGE_REPLACED.equals(accion)) {
                      Scheduler.restaurar(c);
                      return;
                  }

                  // Ha llegado la hora.
                  SharedPreferences p = Scheduler.prefs(c);
                  if (p.getBoolean("daily", false)) {
                      Scheduler.programar(c, Scheduler.siguienteDisparo(
                              p.getInt("hour", 7), p.getInt("minute", 0)));
                  } else {
                      p.edit().putBoolean("enabled", false).apply();
                  }
                  disparar(c);
              }

              static void disparar(Context c) {
                  NotificationManager nm =
                          (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  NotificationChannel canal = new NotificationChannel(
                          CANAL, "Alarma", NotificationManager.IMPORTANCE_HIGH);
                  canal.setSound(null, null);
                  nm.createNotificationChannel(canal);

                  Intent i = new Intent(c, AlarmActivity.class);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  PendingIntent pi = PendingIntent.getActivity(c, 3, i,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                  // Plan A: notificación con pantalla completa (lo que usan los despertadores).
                  Notification n = new Notification.Builder(c, CANAL)
                          .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                          .setContentTitle("Despertador")
                          .setContentText("Toca para abrir el vídeo")
                          .setCategory(Notification.CATEGORY_ALARM)
                          .setAutoCancel(true)
                          .setContentIntent(pi)
                          .setFullScreenIntent(pi, true)
                          .build();
                  nm.notify(1, n);

                  // Plan B: abrir la pantalla directamente (funciona si Android lo permite).
                  try {
                      c.startActivity(i);
                  } catch (Exception e) {
                      // Si Android lo bloquea, ya está el plan A.
                  }
              }
          }
          FIN_ARCHIVO_7
          mkdir -p app/src/main/java/com/despertador/youtube
          cat > app/src/main/java/com/despertador/youtube/Scheduler.java <<'FIN_ARCHIVO_8'
          package com.despertador.youtube;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import java.util.Calendar;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class Scheduler {
              static final String PREFS = "despertador";
              static final String ACCION_ALARMA = "com.despertador.youtube.ALARMA";

              // Almacenamiento protegido por dispositivo: se puede leer aunque el móvil
              // se acabe de encender y todavía no lo hayas desbloqueado.
              static SharedPreferences prefs(Context c) {
                  return c.createDeviceProtectedStorageContext()
                          .getSharedPreferences(PREFS, Context.MODE_PRIVATE);
              }

              static PendingIntent alarmaPending(Context c) {
                  Intent i = new Intent(c, AlarmReceiver.class);
                  i.setAction(ACCION_ALARMA);
                  return PendingIntent.getBroadcast(c, 1, i,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              static long siguienteDisparo(int hora, int minuto) {
                  Calendar cal = Calendar.getInstance();
                  cal.set(Calendar.HOUR_OF_DAY, hora);
                  cal.set(Calendar.MINUTE, minuto);
                  cal.set(Calendar.SECOND, 0);
                  cal.set(Calendar.MILLISECOND, 0);
                  if (cal.getTimeInMillis() <= System.currentTimeMillis()) {
                      cal.add(Calendar.DAY_OF_YEAR, 1);
                  }
                  return cal.getTimeInMillis();
              }

              // Devuelve la hora programada, o -1 si falta el permiso de alarmas exactas.
              static long programar(Context c, long momento) {
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  Intent abrir = new Intent(c, MainActivity.class);
                  PendingIntent abrirPi = PendingIntent.getActivity(c, 2, abrir,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  try {
                      am.setAlarmClock(new AlarmManager.AlarmClockInfo(momento, abrirPi), alarmaPending(c));
                  } catch (SecurityException e) {
                      return -1;
                  }
                  prefs(c).edit().putBoolean("enabled", true).putLong("trigger", momento).apply();
                  return momento;
              }

              static void cancelar(Context c) {
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  am.cancel(alarmaPending(c));
                  prefs(c).edit().putBoolean("enabled", false).apply();
              }

              // Se llama al reiniciar el móvil: Android borra las alarmas al apagarse.
              static void restaurar(Context c) {
                  SharedPreferences p = prefs(c);
                  if (!p.getBoolean("enabled", false)) return;
                  long momento = p.getLong("trigger", 0);
                  long ahora = System.currentTimeMillis();
                  if (momento > ahora) {
                      programar(c, momento);
                      return;
                  }
                  boolean diaria = p.getBoolean("daily", false);
                  boolean reciente = ahora - momento < 15 * 60 * 1000L;
                  if (diaria) {
                      programar(c, siguienteDisparo(p.getInt("hour", 7), p.getInt("minute", 0)));
                  } else {
                      p.edit().putBoolean("enabled", false).apply();
                  }
                  // Si el móvil se encendió pocos minutos después de la hora, suena ya.
                  if (reciente) AlarmReceiver.disparar(c);
              }

              static String normalizarUrl(String u) {
                  u = (u == null) ? "" : u.trim();
                  Matcher m = Pattern
                          .compile("(?:youtu\\.be/|[?&]v=|/shorts/|/embed/|/live/)([A-Za-z0-9_-]{11})")
                          .matcher(u);
                  if (m.find()) return "https://m.youtube.com/watch?v=" + m.group(1);
                  if (!u.startsWith("http")) u = "https://" + u;
                  return u;
              }
          }
          FIN_ARCHIVO_8

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar
        run: gradle assembleDebug --no-daemon

      - name: Guardar la APK
        uses: actions/upload-artifact@v4
        with:
          name: despertador-youtube-apk
          path: app/build/outputs/apk/debug/*.apk
